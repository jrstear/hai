name: pida
description: Pida - User-facing Flutter app for Hai audio lifelog processing system
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  
  # HTTP client
  dio: ^5.4.0
  
  # Routing
  go_router: ^13.0.0
  
  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # File handling
  file_picker: ^6.1.1
  
  # Audio playback
  audioplayers: ^5.2.1
  
  # Utilities
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  # assets:
  #   - images/
  #   - icons/

