version: '3'

vars:
  PIDA_API_URL: ${PIDA_API_URL:-http://localhost:8080}
  LIMITLESS_API_KEY: ${LIMITLESS_API_KEY:-}
  RECORDING_DEVICE_ID: ${RECORDING_DEVICE_ID:-}
  DEVICE: ${DEVICE:-chrome}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  run:
    desc: Run Flutter web app in Chrome
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        echo "Starting Flutter web app..."
        echo "API Base URL: ${PIDA_API_URL:-{{.PIDA_API_URL}}}"
        echo "Device: {{.DEVICE}}"
        flutter run -d {{.DEVICE}} \
          --dart-define=PIDA_API_URL="${PIDA_API_URL:-{{.PIDA_API_URL}}}" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
    env:
      LIMITLESS_API_KEY: "{{.LIMITLESS_API_KEY}}"
      RECORDING_DEVICE_ID: "{{.RECORDING_DEVICE_ID}}"

  run-android:
    desc: Run Flutter app on Android device/emulator
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        # Check if any Android device/emulator is available
        # Filter out error messages and only get actual device lines (lines with "android" and bullet points)
        ANDROID_DEVICE=$(flutter devices 2>&1 | grep -E "^.*•.*•.*android" | head -1 | sed -E 's/.*• ([^ ]+) •.*/\1/' || echo "")
        if [ -z "$ANDROID_DEVICE" ]; then
          echo "No Android device/emulator found."
          echo ""
          echo "To start an Android emulator manually, run:"
          echo "  flutter emulators --launch <emulator_id>"
          echo ""
          echo "Available emulators:"
          flutter emulators 2>&1 | grep -E "android" || echo "  (none found)"
          echo ""
          echo "Or create a new emulator with:"
          echo "  flutter emulators --create"
          exit 1
        fi
        # Detect if running on emulator (check for emulator-* device)
        DEVICE_ID=$(flutter devices 2>&1 | grep -E "emulator-[0-9]+" | head -1 | sed -E 's/.*• ([^ ]+) •.*/\1/' || echo "")
        if [ -n "$DEVICE_ID" ]; then
          # Running on emulator - use 10.0.2.2 (maps to host localhost)
          # Convert localhost/127.0.0.1 to emulator-friendly address
          if [ -n "$PIDA_API_URL" ]; then
            # Replace localhost or 127.0.0.1 with 10.0.2.2 for emulator
            ANDROID_API_URL=$(echo "$PIDA_API_URL" | sed 's|http://localhost|http://10.0.2.2|g' | sed 's|http://127.0.0.1|http://10.0.2.2|g')
            if [ "$ANDROID_API_URL" != "$PIDA_API_URL" ]; then
              echo "Emulator detected: Converted localhost to 10.0.2.2 (emulator-friendly)"
            fi
          else
            ANDROID_API_URL="http://10.0.2.2:8080"
            echo "Emulator detected: Using emulator-friendly URL (10.0.2.2 maps to host localhost)"
          fi
          DEVICE_ARG="-d $DEVICE_ID"
          echo "Using emulator: $DEVICE_ID"
        else
          # Physical device - use PIDA_API_URL or default
          ANDROID_API_URL="${PIDA_API_URL:-http://localhost:8080}"
          DEVICE_ARG="-d $ANDROID_DEVICE"
          echo "Using device: $ANDROID_DEVICE"
        fi
        echo "Starting Flutter Android app..."
        echo "API URL: $ANDROID_API_URL"
        flutter run $DEVICE_ARG \
          --dart-define=PIDA_API_URL="$ANDROID_API_URL" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
    env:
      LIMITLESS_API_KEY: "{{.LIMITLESS_API_KEY}}"
      RECORDING_DEVICE_ID: "{{.RECORDING_DEVICE_ID}}"

  run-ios:
    desc: Run Flutter app on iOS device/simulator
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        # Find first available iOS simulator (check for lines containing "ios" and "simulator")
        IOS_DEVICE=$(flutter devices 2>&1 | grep -i "ios" | grep -i "simulator" | head -1 | sed -E 's/.*• ([^ ]+) •.*/\1/' || echo "")
        if [ -z "$IOS_DEVICE" ]; then
          echo "No iOS simulator found. Opening Simulator app..."
          open -a Simulator
          echo "Waiting for simulator to boot (this may take 30-60 seconds)..."
          sleep 5
          # Wait up to 60 seconds for simulator to appear
          for i in {1..12}; do
            IOS_DEVICE=$(flutter devices 2>&1 | grep -i "ios" | grep -i "simulator" | head -1 | sed -E 's/.*• ([^ ]+) •.*/\1/' || echo "")
            if [ -n "$IOS_DEVICE" ]; then
              echo "Simulator ready: $IOS_DEVICE"
              break
            fi
            echo "Waiting for simulator... ($i/12)"
            sleep 5
          done
        fi
        if [ -z "$IOS_DEVICE" ]; then
          echo "Error: No iOS simulator found after waiting."
          echo ""
          echo "To start an iOS simulator manually, run:"
          echo "  open -a Simulator"
          echo "  # Then select a device from Hardware > Device menu"
          echo ""
          echo "Or use:"
          echo "  xcrun simctl boot <device-id>"
          exit 1
        fi
        echo "Using iOS device: $IOS_DEVICE"
        echo "Starting Flutter iOS app..."
        flutter run -d "$IOS_DEVICE" \
          --dart-define=PIDA_API_URL="${PIDA_API_URL:-{{.PIDA_API_URL}}}" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
    env:
      LIMITLESS_API_KEY: "{{.LIMITLESS_API_KEY}}"
      RECORDING_DEVICE_ID: "{{.RECORDING_DEVICE_ID}}"

  build:
    desc: Build Flutter web app for production
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        echo "Building Flutter web app..."
        flutter build web \
          --dart-define=PIDA_API_URL="${PIDA_API_URL:-{{.PIDA_API_URL}}}" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
        echo "Build output: build/web/"

  build-android:
    desc: Build Flutter Android APK
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        echo "Building Flutter Android APK..."
        flutter build apk \
          --dart-define=PIDA_API_URL="${PIDA_API_URL:-{{.PIDA_API_URL}}}" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
        echo "Build output: build/app/outputs/flutter-apk/"

  build-ios:
    desc: Build Flutter iOS app
    cmds:
      - |
        if [ -f ../.env ]; then
          echo "Loading environment variables from ../.env"
          set -a
          source ../.env
          set +a
        fi
        echo "Building Flutter iOS app..."
        flutter build ios \
          --dart-define=PIDA_API_URL="${PIDA_API_URL:-{{.PIDA_API_URL}}}" \
          --dart-define=LIMITLESS_API_KEY="${LIMITLESS_API_KEY:-{{.LIMITLESS_API_KEY}}}" \
          --dart-define=RECORDING_DEVICE_ID="${RECORDING_DEVICE_ID:-{{.RECORDING_DEVICE_ID}}}"
        echo "Build output: build/ios/"

  test:
    desc: Run Flutter tests
    cmds:
      - flutter test

  analyze:
    desc: Analyze Flutter code (linting)
    cmds:
      - flutter analyze

  format:
    desc: Format Dart code
    cmds:
      - dart format .

  format-check:
    desc: Check if Dart code is formatted
    cmds:
      - dart format --set-exit-if-changed .

  clean:
    desc: Clean Flutter build artifacts
    cmds:
      - flutter clean

  pub-get:
    desc: Get Flutter dependencies
    cmds:
      - flutter pub get

  pub-upgrade:
    desc: Upgrade Flutter dependencies
    cmds:
      - flutter pub upgrade

  pub-outdated:
    desc: Show outdated Flutter dependencies
    cmds:
      - flutter pub outdated

  generate:
    desc: Generate code (build_runner for freezed/json_serializable)
    cmds:
      - flutter pub run build_runner build --delete-conflicting-outputs

  generate-watch:
    desc: Watch for changes and regenerate code
    cmds:
      - flutter pub run build_runner watch --delete-conflicting-outputs

  doctor:
    desc: Run Flutter doctor to check setup
    cmds:
      - flutter doctor

  devices:
    desc: List available Flutter devices
    cmds:
      - flutter devices

  check:
    desc: Run all checks (format-check, analyze, test)
    cmds:
      - task: format-check
      - task: analyze
      - task: test

  setup:
    desc: Initial setup (get dependencies, generate code)
    cmds:
      - task: pub-get
      - task: generate

  deps:
    desc: Alias for pub-get
    cmds:
      - task: pub-get
