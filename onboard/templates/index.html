<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hai Audio Lifelog - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .date-selection {
            margin-bottom: 20px;
        }

        .date-range-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .date-range-inputs input {
            flex: 1;
        }

        .date-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }

        .date-checkbox {
            display: flex;
            align-items: center;
            padding: 8px;
            margin: 4px 0;
        }

        .date-checkbox input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .status {
            margin-top: 30px;
            display: none;
        }

        .status.active {
            display: block;
        }

        .progress-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .progress-table th,
        .progress-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .progress-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
        }

        .progress-table tr:hover {
            background: #f9f9f9;
        }

        .stage-cell {
            min-width: 150px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Status icons */
        .status-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .status-icon.checkmark {
            color: #27ae60;
        }

        .status-icon.checkmark-skipped {
            color: #3498db; /* Blue for skipped (cached/already present) */
            font-weight: 600;
        }
        
        .status-icon.skipped-text {
            color: #3498db;
            font-size: 12px;
            font-weight: 500;
        }

        .status-icon.failed {
            color: #e74c3c;
        }
        .status-icon.not-available {
            color: #999; /* Gray */
            font-weight: normal;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Date group styling */
        .date-group {
            margin-bottom: 20px;
        }
        
        .date-separator {
            border-top: 2px solid #e0e0e0;
            margin: 15px 0 10px 0;
        }

        .date-header {
            font-weight: 600;
            color: #333;
            padding: 10px 0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .date-header .date-label {
            font-weight: 600;
        }
        
        .date-header .separator {
            color: #ccc;
            font-weight: normal;
        }
        
        .date-header .lifelog-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .date-header .lifelog-section .label {
            font-weight: 500;
            color: #666;
            font-size: 14px;
        }

        .hours-section {
            margin-left: 20px;
        }

        .hour-row {
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hour-row.hour-header {
            padding: 8px 0 4px 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 4px;
        }

        .hour-time {
            display: inline-block;
            width: 80px;
            font-weight: 500;
            color: #333;
        }

        .stage-status {
            display: inline-block;
            width: 150px;
            min-height: 20px;
        }

        .stage-status .error {
            margin-top: 4px;
            font-size: 11px;
            color: #e74c3c;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
        }

        .overall-progress {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .overall-progress h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            transition: width 0.3s ease;
            min-width: 0%;
            width: 0%;
        }

        .progress-fill.running {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            animation: progress-pulse 2s ease-in-out infinite;
        }

        .progress-fill.done {
            background: #27ae60;
        }

        @keyframes progress-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            padding: 10px;
            background: #fee;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hai!</h1>
        <p class="subtitle">Enter API key and date range, and press "Start Processing" to download daily lifelogs and hourly audio, and diarize audio.</p>

        <div id="onboarding">
            <form id="setupForm">
                <div class="form-group">
                    <label for="apiKey">Limitless API Key</label>
                    <input type="text" id="apiKey" name="apiKey" required 
                           placeholder="sk-..." autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <select id="timezone" name="timezone">
                        <option value="America/Denver">America/Denver (MST)</option>
                        <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
                        <option value="America/New_York">America/New_York (EST)</option>
                        <option value="UTC">UTC</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="startTime">Start Date & Time</label>
                    <input type="datetime-local" id="startTime" name="startTime" required step="3600">
                    <small style="color: #666; font-size: 12px; display: block; margin-top: 4px;">Only full hours are allowed (:00)</small>
                </div>

                <div class="form-group">
                    <label for="endTime">End at Date & Time (non-inclusive)</label>
                    <input type="datetime-local" id="endTime" name="endTime" required step="3600">
                    <small style="color: #666; font-size: 12px; display: block; margin-top: 4px;">Only full hours are allowed (:00)</small>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="reprocess" name="reprocess" style="width: auto; margin: 0;">
                        <span>Reprocess existing data (removes and re-downloads/re-processes already completed hours)</span>
                    </label>
                </div>

                <button type="submit" id="submitBtn">Start Processing</button>
            </form>
        </div>

        <div id="status" class="status">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h3 style="margin: 0;">Processing Status</h3>
                    <button id="getMoreBtn" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;" onclick="resetToInitialState()">Get More!</button>
                </div>
                <button id="cancelBtn" style="display: none; padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;" onclick="cancelJob()">Cancel Processing</button>
            </div>
            <div class="overall-progress">
                <h3>Overall Progress</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="overallProgressFill"></div>
                </div>
                <div style="text-align: center; margin-top: 8px; color: #666; font-size: 14px;">
                    <span id="overallProgressText">0%</span>
                </div>
            </div>

            <div id="progressContainer">
                <!-- Date groups will be inserted here -->
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script>
        let jobId = null;
        let pollInterval = null;

        // Form submission
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiKey = document.getElementById('apiKey').value;
            const timezone = document.getElementById('timezone').value;
            const startTimeInput = document.getElementById('startTime');
            const endTimeInput = document.getElementById('endTime');
            const reprocess = document.getElementById('reprocess').checked;

            if (!startTimeInput.value || !endTimeInput.value) {
                alert('Please select both start and end times');
                return;
            }

            // datetime-local input gives us a string like "2025-11-22T14:00" in local time
            // Convert to Date object (interprets as local time), then to ISO string
            const start = new Date(startTimeInput.value);
            const end = new Date(endTimeInput.value);

            // Check if dates are valid
            if (isNaN(start.getTime())) {
                alert('Invalid start date/time. Please select a valid date and time.');
                startTimeInput.focus();
                return;
            }
            if (isNaN(end.getTime())) {
                alert('Invalid end date/time. Please select a valid date and time.');
                endTimeInput.focus();
                return;
            }

            if (start >= end) {
                alert('End time must be after start time (non-inclusive)');
                return;
            }
            
            // Validate that minutes are :00 (only full hours allowed, including 00:00)
            const startMinutes = start.getMinutes();
            const endMinutes = end.getMinutes();
            if (startMinutes !== 0) {
                alert('Start time must be on the hour (:00). Only full hours are allowed.');
                startTimeInput.focus();
                return;
            }
            if (endMinutes !== 0) {
                alert('End time must be on the hour (:00). Only full hours are allowed.');
                endTimeInput.focus();
                return;
            }
            
            // Convert to ISO strings (includes timezone offset)
            const startISO = start.toISOString();
            const endISO = end.toISOString();

            // Hide form, show status
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('status').classList.add('active');

            // Initialize progress container (will be populated from server response)
            document.getElementById('progressContainer').innerHTML = '<div style="text-align: center; padding: 20px;">Initializing...</div>';

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        apiKey: apiKey,
                        startTime: startISO,
                        endTime: endISO,
                        timezone: timezone,
                        reprocess: reprocess,
                    }),
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }

                const data = await response.json();
                jobId = data.jobId;

                // Show cancel button, hide Get More button
                document.getElementById('cancelBtn').style.display = 'block';
                document.getElementById('getMoreBtn').style.display = 'none';

                // Start polling
                pollStatus();
            } catch (error) {
                showError(error.message);
            }
        });

        function initializeProgressTable(hourProgress, job) {
            const container = document.getElementById('progressContainer');
            const hours = Object.keys(hourProgress || {}).sort();
            
            if (hours.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px;">No hours to process</div>';
                return;
            }
            
            // Group hours by date (in user's timezone)
            const dateGroups = {};
            for (const hour of hours) {
                const progress = hourProgress[hour];
                const displayHour = (progress && progress.display_hour) ? progress.display_hour : formatHour(hour);
                const [date] = displayHour.split(' ');
                
                if (!dateGroups[date]) {
                    dateGroups[date] = [];
                }
                dateGroups[date].push({ hour, progress, displayHour });
            }
            
            // Sort dates
            const sortedDates = Object.keys(dateGroups).sort();
            
            // Render date groups
            container.innerHTML = sortedDates.map(date => {
                const hoursInDate = dateGroups[date];
                // Get lifelog status from first hour (all hours in same date share lifelog status)
                const lifelogStatus = hoursInDate[0].progress.lifelog || 'pending';
                
                return `
                    <div class="date-group" data-date="${date}">
                        <div class="date-separator"></div>
                        <div class="date-header">
                            <span class="date-label">Date: ${date}</span>
                            <span class="lifelog-section">
                                <span class="label">Lifelog:</span>
                                <span>Download</span>
                                <span class="stage-status" data-date="${date}" data-stage="lifelog">
                                    ${renderStatusIcon(lifelogStatus)}
                                </span>
                            </span>
                            <span class="lifelog-section">
                                <span>Load Elasticsearch</span>
                                <span class="stage-status" data-date="${date}" data-stage="lifelog-elasticsearch">
                                    ${renderStatusIcon(job.date_lifelog_elasticsearch && job.date_lifelog_elasticsearch[date] ? job.date_lifelog_elasticsearch[date] : 'pending')}
                                </span>
                            </span>
                        </div>
                        <div class="hours-section">
                            <div class="hour-row hour-header">
                                <span class="hour-time"></span>
                                <span class="stage-status" style="font-weight: 500; color: #666;">Download Audio</span>
                                <span class="stage-status" style="font-weight: 500; color: #666;">Diarize Audio</span>
                                <span class="stage-status" style="font-weight: 500; color: #666;">Load Elasticsearch</span>
                            </div>
                            ${hoursInDate.map(({ hour, displayHour }) => {
                                const [_, time] = displayHour.split(' ');
                                const hourOnly = time.split(':')[0] + ':00';
                                return `
                                    <div class="hour-row" data-hour="${hour}">
                                        <span class="hour-time">${hourOnly}</span>
                                        <span class="stage-status" data-hour="${hour}" data-stage="audio">
                                            ${renderStatusIcon(hourProgress[hour].audio || 'pending')}
                                        </span>
                                        <span class="stage-status" data-hour="${hour}" data-stage="diarize">
                                            ${renderStatusIcon(hourProgress[hour].diarize || 'pending')}
                                        </span>
                                        <span class="stage-status" data-hour="${hour}" data-stage="elasticsearch">
                                            ${renderStatusIcon(hourProgress[hour].elasticsearch || 'pending')}
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderStatusIcon(status) {
            if (status === 'done') {
                return '<span class="status-icon checkmark">✓</span>';
            } else if (status === 'running') {
                return '<span class="spinner"></span>';
            } else if (status === 'failed') {
                return '<span class="status-icon failed">✗</span>';
            } else if (status === 'skipped') {
                return '<span class="status-icon skipped-text" title="Already in Elasticsearch">⊘</span>';
            } else if (status === 'not_available') {
                return '<span class="status-icon not-available">N/A</span>'; // N/A text
            } else {
                return '<span class="status-icon"></span>'; // pending - blank
            }
        }

        function formatHour(hourStr) {
            // Format "2025-11-22 15:04" to "2025-11-22 15:00"
            const [date, time] = hourStr.split(' ');
            const [hour] = time.split(':');
            return `${date} ${hour}:00`;
        }

        async function pollStatus() {
            if (!jobId) return;

            try {
                const response = await fetch(`/api/status?jobId=${jobId}`);
                if (!response.ok) {
                    throw new Error('Failed to get status');
                }

                const job = await response.json();
                updateProgress(job);

                // Continue polling if not completed, failed, or cancelled
                if (job.status === 'completed' || job.status === 'failed' || job.status === 'cancelled') {
                    if (pollInterval) {
                        clearInterval(pollInterval);
                    }
                    // Hide cancel button, show Get More button
                    document.getElementById('cancelBtn').style.display = 'none';
                    document.getElementById('getMoreBtn').style.display = 'block';
                    if (job.status === 'failed') {
                        showError(job.error || 'Processing failed');
                    } else if (job.status === 'cancelled') {
                        showError('Processing was cancelled');
                    }
                } else {
                    // Poll again in 1 second
                    if (!pollInterval) {
                        pollInterval = setInterval(pollStatus, 1000);
                    }
                }
            } catch (error) {
                showError(error.message);
                if (pollInterval) {
                    clearInterval(pollInterval);
                }
            }
        }

        function updateProgress(job) {
            // Update overall progress
            const overallFill = document.getElementById('overallProgressFill');
            const overallText = document.getElementById('overallProgressText');
            overallFill.style.width = job.progress + '%';
            
            // Show "Done!" in bold green when 100%, otherwise show percentage
            if (job.progress === 100 || job.status === 'completed') {
                overallText.textContent = 'Done!';
                overallText.style.fontWeight = 'bold';
                overallText.style.color = '#27ae60'; // Green
            } else {
                overallText.textContent = job.progress + '%';
                overallText.style.fontWeight = 'normal';
                overallText.style.color = '#666'; // Default gray
            }
            
            // Add animation if processing, mark as done if completed
            if (job.status === 'completed') {
                overallFill.classList.add('done');
                overallFill.classList.remove('running');
            } else if (job.status === 'processing' && job.progress > 0 && job.progress < 100) {
                overallFill.classList.add('running');
                overallFill.classList.remove('done');
            } else {
                overallFill.classList.remove('running');
                if (job.progress === 100) {
                    overallFill.classList.add('done');
                }
            }

            // Initialize progress container if needed
            if (job.hour_progress && Object.keys(job.hour_progress).length > 0) {
                const container = document.getElementById('progressContainer');
                if (container.children.length === 0 || container.textContent.includes('Initializing')) {
                    initializeProgressTable(job.hour_progress, job);
                }
            }

            // Update per-hour progress
            for (const [hour, progress] of Object.entries(job.hour_progress || {})) {
                updateHourProgress(hour, progress, job);
            }
            
            // Update lifelog Elasticsearch status for all dates (per-date, not per-hour)
            if (job.date_lifelog_elasticsearch) {
                for (const [date, status] of Object.entries(job.date_lifelog_elasticsearch)) {
                    const lifelogESStatusEl = document.querySelector(`.stage-status[data-date="${date}"][data-stage="lifelog-elasticsearch"]`);
                    if (lifelogESStatusEl) {
                        lifelogESStatusEl.innerHTML = renderStatusIcon(status);
                    }
                }
            }
        }

        function updateHourProgress(hour, progress, job) {
            // Extract date from display_hour for grouping
            const displayHour = (progress && progress.display_hour) ? progress.display_hour : formatHour(hour);
            const [date] = displayHour.split(' ');
            
            // Update lifelog status (shared across all hours in the same date)
            const lifelogStatusEl = document.querySelector(`.stage-status[data-date="${date}"][data-stage="lifelog"]`);
            if (lifelogStatusEl) {
                lifelogStatusEl.innerHTML = renderStatusIcon(progress.lifelog || 'pending');
            }
            
            // Update lifelog Elasticsearch status (shared across all hours in the same date)
            if (job && job.date_lifelog_elasticsearch && job.date_lifelog_elasticsearch[date]) {
                const lifelogESStatusEl = document.querySelector(`.stage-status[data-date="${date}"][data-stage="lifelog-elasticsearch"]`);
                if (lifelogESStatusEl) {
                    lifelogESStatusEl.innerHTML = renderStatusIcon(job.date_lifelog_elasticsearch[date]);
                }
            }
            
            // Update hour-specific stages (audio, diarize, elasticsearch)
            ['audio', 'diarize', 'elasticsearch'].forEach(stage => {
                const statusEl = document.querySelector(`.stage-status[data-hour="${hour}"][data-stage="${stage}"]`);
                if (!statusEl) {
                    // Element doesn't exist yet, reinitialize
                    initializeProgressTable({[hour]: progress}, job);
                    return;
                }
                
                const status = progress[stage] || 'pending';
                statusEl.innerHTML = renderStatusIcon(status);
                
                // Show error message if failed
                if (status === 'failed' && progress.error && progress.error.trim() !== '') {
                    let errorDiv = statusEl.parentElement.querySelector('.error');
                    if (!errorDiv) {
                        errorDiv = document.createElement('div');
                        errorDiv.className = 'error';
                        statusEl.parentElement.appendChild(errorDiv);
                    }
                    errorDiv.textContent = progress.error;
                } else {
                    // Remove error message if status changed
                    const hourRow = statusEl.closest('.hour-row');
                    if (hourRow) {
                        const errorDiv = hourRow.querySelector('.error');
                        if (errorDiv) {
                            errorDiv.remove();
                        }
                    }
                }
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = message ? 'block' : 'none';
        }

        async function cancelJob() {
            if (!jobId) return;

            if (!confirm('Are you sure you want to cancel processing? This will stop all current operations.')) {
                return;
            }

            try {
                const response = await fetch(`/api/cancel?jobId=${jobId}`, {
                    method: 'POST',
                });

                if (!response.ok) {
                    throw new Error('Failed to cancel job');
                }

                // Stop polling
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }

                // Hide cancel button, show Get More button
                document.getElementById('cancelBtn').style.display = 'none';
                document.getElementById('getMoreBtn').style.display = 'block';

                // Update status
                showError('Processing cancelled');
            } catch (error) {
                showError('Failed to cancel: ' + error.message);
            }
        }

        function resetToInitialState() {
            // Stop any polling
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }

            // Clear job ID
            jobId = null;

            // Save the API key value
            const savedApiKey = document.getElementById('apiKey').value;

            // Hide status section, show onboarding form
            document.getElementById('status').classList.remove('active');
            document.getElementById('onboarding').style.display = 'block';

            // Reset form fields (except API key)
            document.getElementById('apiKey').value = savedApiKey; // Restore API key
            document.getElementById('timezone').value = 'America/Denver'; // Reset to default
            document.getElementById('reprocess').checked = false; // Uncheck reprocess

            // Reset date/time inputs to defaults
            const startTime = new Date(2025, 10, 22, 14, 0, 0);
            const endTime = new Date(2025, 10, 22, 18, 0, 0);
            const formatDateTimeLocal = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}-${month}-${day}T${hours}:${minutes}`;
            };
            document.getElementById('startTime').value = formatDateTimeLocal(startTime);
            document.getElementById('endTime').value = formatDateTimeLocal(endTime);

            // Reset progress table
            document.getElementById('progressContainer').innerHTML = '';

            // Reset overall progress
            const overallFill = document.getElementById('overallProgressFill');
            overallFill.style.width = '0%';
            overallFill.classList.remove('running', 'done');
            const overallText = document.getElementById('overallProgressText');
            overallText.textContent = '0%';
            overallText.style.fontWeight = 'normal';
            overallText.style.color = '#666';

            // Hide cancel button, show Get More button
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('getMoreBtn').style.display = 'block';

            // Clear error messages
            showError('');
        }

        // Set default time range (Nov 22, 2025, 2pm-6pm in local timezone)
        // datetime-local inputs work in the browser's local timezone
        // Create dates in local timezone (not UTC)
        const startTime = new Date(2025, 10, 22, 14, 0, 0); // Nov 22, 2025, 2pm local time (month is 0-indexed)
        const endTime = new Date(2025, 10, 22, 18, 0, 0); // Nov 22, 2025, 6pm local time
        
        // Format for datetime-local input (YYYY-MM-DDTHH:mm)
        // Note: datetime-local doesn't include timezone, it uses browser's local timezone
        const formatDateTimeLocal = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        };
        
        document.getElementById('startTime').value = formatDateTimeLocal(startTime);
        document.getElementById('endTime').value = formatDateTimeLocal(endTime);
        
        // Add event listeners to validate minutes are always :00
        function validateMinutes(input) {
            input.addEventListener('change', function() {
                if (!this.value) return; // Skip if empty
                
                // Parse datetime-local value (format: YYYY-MM-DDTHH:mm)
                // datetime-local is already in local time, so we need to parse it carefully
                const dateStr = this.value;
                const date = new Date(dateStr);
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    // Invalid date - try to fix by ensuring format is correct
                    console.warn('Invalid date value:', dateStr);
                    return;
                }
                
                // Check minutes (00:00 is valid, we just need to ensure it's on the hour)
                if (date.getMinutes() !== 0) {
                    alert('Only full hours are allowed (:00). Minutes will be reset to :00.');
                    // Reset to :00
                    date.setMinutes(0);
                    this.value = formatDateTimeLocal(date);
                }
            });
            
            // Also validate on blur in case user manually types
            input.addEventListener('blur', function() {
                if (!this.value) return; // Skip if empty
                
                const dateStr = this.value;
                const date = new Date(dateStr);
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    console.warn('Invalid date value:', dateStr);
                    return;
                }
                
                // Only reset minutes if they're not already 0
                if (date.getMinutes() !== 0) {
                    date.setMinutes(0);
                    this.value = formatDateTimeLocal(date);
                }
            });
        }
        
        validateMinutes(document.getElementById('startTime'));
        validateMinutes(document.getElementById('endTime'));
    </script>
</body>
