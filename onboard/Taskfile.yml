# Taskfile for onboarding server
# Install task: https://taskfile.dev/installation/
# Run: task <command>

version: '3'

vars:
  BINARY_NAME: hai-onboard
  MAIN_PACKAGE: ./cmd/server
  PORT: "3000"
  PYTHON_ENV: hai

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Setup all prerequisites (Python, dependencies)
    cmds:
      - task: setup-python
      - task: deps

  setup-python:
    desc: Setup Python/conda environment for diarization
    cmds:
      - ./scripts/setup-python.sh

  check-python:
    desc: Check if Python environment is ready
    cmds:
      - ./scripts/check-python.sh

  build:
    desc: Build the onboarding server binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} {{.MAIN_PACKAGE}}
    generates:
      - bin/{{.BINARY_NAME}}

  run:
    desc: Run the onboarding server (development)
    deps: [check-python, build]
    cmds:
      - ./bin/{{.BINARY_NAME}} --port {{.PORT}}

  dev:
    desc: "Run with auto-reload (requires air: go install github.com/cosmtrek/air@latest)"
    deps: [check-python]
    cmds:
      - air -c .air.toml

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-cover:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "Coverage report: coverage.html"'

  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f coverage.out coverage.html

  install:
    desc: Install binary to $GOPATH/bin
    cmds:
      - go install {{.MAIN_PACKAGE}}

  deps:
    desc: Download Go dependencies
    cmds:
      - go mod download
      - go mod tidy

  deps-update:
    desc: Update all Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run all checks (fmt, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  # Docker tasks (for later)
  check-docker:
    desc: Check if Docker is installed and running
    cmds:
      - docker --version
      - docker-compose --version
      - 'docker info > /dev/null 2>&1 || (echo "Error: Docker daemon not running" && exit 1)'
      - 'echo "✅ Docker is ready"'

  build-load-es:
    desc: Build the load-es CLI utility
    cmds:
      - go build -o bin/load-es ./cmd/load-es
    generates:
      - bin/load-es

  load-es:
    desc: Load diarization results to Elasticsearch
    deps: [build-load-es]
    cmds:
      - ./bin/load-es {{.CLI_ARGS}}

  build-match-blockquotes-to-segments:
    desc: Build the match-blockquotes-to-segments CLI utility
    cmds:
      - go build -o bin/match-blockquotes-to-segments ./cmd/match-blockquotes-to-segments
    generates:
      - bin/match-blockquotes-to-segments

  match-blockquotes-to-segments:
    desc: Match lifelog blockquotes to segments based on time overlap
    deps: [build-match-blockquotes-to-segments]
    cmds:
      - ./bin/match-blockquotes-to-segments {{.CLI_ARGS}}

  build-delete-es-indexes:
    desc: Build the delete-es-indexes CLI utility
    cmds:
      - go build -o bin/delete-es-indexes ./cmd/delete-es-indexes
    generates:
      - bin/delete-es-indexes

  delete-es-indexes:
    desc: Delete Elasticsearch indexes (requires -confirm flag)
    deps: [build-delete-es-indexes]
    cmds:
      - ./bin/delete-es-indexes {{.CLI_ARGS}}

  build-delete-recording-data:
    desc: Build the delete-recording-data CLI utility
    cmds:
      - go build -o bin/delete-recording-data ./cmd/delete-recording-data
    generates:
      - bin/delete-recording-data

  delete-recording-data:
    desc: Delete segments, embeddings, and recording for a specific recording ID
    deps: [build-delete-recording-data]
    cmds:
      - ./bin/delete-recording-data {{.CLI_ARGS}}

  build-delete-by-date-range:
    desc: Build the delete-by-date-range CLI utility
    cmds:
      - go build -o bin/delete-by-date-range ./cmd/delete-by-date-range
    generates:
      - bin/delete-by-date-range

  delete-by-date-range:
    desc: Delete recordings, segments, and embeddings for a date range (YYYY-MM-DD)
    deps: [build-delete-by-date-range]
    cmds:
      - ./bin/delete-by-date-range {{.CLI_ARGS}}

  build-create-es-indexes:
    desc: Build the create-es-indexes CLI utility
    cmds:
      - go build -o bin/create-es-indexes ./cmd/create-es-indexes
    generates:
      - bin/create-es-indexes

  create-es-indexes:
    desc: Create Elasticsearch indexes with updated schema
    deps: [build-create-es-indexes]
    cmds:
      - ./bin/create-es-indexes {{.CLI_ARGS}}

  build-create-speakers:
    desc: Build the create-speakers CLI utility
    cmds:
      - go build -o bin/create-speakers ./cmd/create-speakers
    generates:
      - bin/create-speakers

  create-speakers:
    desc: Run speaker clustering to create/update speakers from embeddings
    deps: [build-create-speakers]
    cmds:
      - ./bin/create-speakers {{.CLI_ARGS}}

