# Taskfile for root-level scripts and utilities
# Install task: https://taskfile.dev/installation/
# Run: task <command>

version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build-setup-kibana:
    desc: Build the setup-kibana-index-patterns script
    cmds:
      - go build -o bin/setup-kibana-index-patterns scripts/setup-kibana-index-patterns.go
    generates:
      - bin/setup-kibana-index-patterns

  setup-kibana-index-patterns:
    desc: Set up Kibana index patterns automatically
    deps: [build-setup-kibana]
    cmds:
      - ./bin/setup-kibana-index-patterns {{.CLI_ARGS}}

  build-delete-kibana-saved-objects:
    desc: Build the delete-kibana-saved-objects script
    cmds:
      - go build -o bin/delete-kibana-saved-objects scripts/delete-kibana-saved-objects.go
    generates:
      - bin/delete-kibana-saved-objects

  delete-kibana-saved-objects:
    desc: Delete Kibana saved objects (index patterns) - requires -confirm flag
    deps: [build-delete-kibana-saved-objects]
    cmds:
      - ./bin/delete-kibana-saved-objects {{.CLI_ARGS}}

