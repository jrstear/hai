services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hai-elasticsearch
    environment:
      # Single-node mode
      - discovery.type=single-node
      # Disable security for local development
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      # JVM heap size (1-2GB as recommended)
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # Additional settings for local dev
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Persistent volume for Elasticsearch data
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - elasticsearch
    networks:
      - hai-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: hai-kibana
    environment:
      # Connect to Elasticsearch
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Disable security for local development (matches Elasticsearch)
      - xpack.security.enabled=false
      # Server settings
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - elasticsearch
    networks:
      - hai-network

volumes:
  es_data:
    driver: local

networks:
  hai-network:
    driver: bridge

